project_id = "kairo"

[auth]
site_url = "https://kairo.makekairo.workers.dev"
additional_redirect_urls = ["https://kairo.makekairo.workers.dev/**", "https://makekairo.netlify.app/**", "http://localhost:3010/**"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
otp_expiry = 900

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(TURNSTILE_SECRET)"
