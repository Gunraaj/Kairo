project_id = "kairo"

[auth]
site_url = "https://kairo.makekairo.workers.dev"
additional_redirect_urls = ["https://kairo.makekairo.workers.dev/**", "https://makekairo.netlify.app/**", "http://localhost:3010/**", "https://kairo-mcp.makekairo.workers.dev/callback**"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
otp_expiry = 900

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(TURNSTILE_SECRET)"

# Sign in with Google (replaces emailed links). The OAuth client lives in a free Google Cloud
# project on the alias account; its id and secret come from .supabase-secrets, never this file.
# Authorized redirect URI in Google Cloud: https://xxfsmnxppdqwnakjijlk.supabase.co/auth/v1/callback
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"
skip_nonce_check = false
