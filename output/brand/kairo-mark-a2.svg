<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">Kairo A2 interval mark</title>
  <desc id="desc">A bold K-derived focus mark with a tactile notch and vermilion active interval.</desc>
  <rect width="120" height="120" fill="#F7F7F3"/>
  <g fill="none" stroke="#20201E" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 18V102"/>
    <path d="M51 52L87 22"/>
    <path d="M51 68L87 98"/>
  </g>
  <!-- shallow tactile notch on the lower arm -->
  <circle cx="52" cy="68" r="7" fill="#F7F7F3"/>
  <!-- active interval latch; intentionally rounded, not a play triangle -->
  <rect x="58" y="54" width="25" height="11" rx="5.5" fill="#C9382A" transform="rotate(-10 70.5 59.5)"/>
</svg>
